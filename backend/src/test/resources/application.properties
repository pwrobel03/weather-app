# Test-scope only. The whole suite hits the auth endpoints from a single
# loopback address, so production brute-force budgets would fail tests that
# have nothing to do with rate limiting. RateLimitFilterTest overrides these
# back down to tight values with @TestPropertySource to prove the limiter works.
#
# This file intentionally holds ONLY these keys: a .properties file sits
# alongside (not instead of) the main application.yml, so everything else -
# datasource, flyway, jwt - still comes from the real configuration.
rate-limit.login.limit=10000
rate-limit.login.window=1m
rate-limit.register.limit=10000
rate-limit.register.window=1m
rate-limit.refresh.limit=10000
rate-limit.refresh.window=1m
