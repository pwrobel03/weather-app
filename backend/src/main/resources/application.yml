spring:
  application:
    name: weather-app-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/weather}
    username: ${DB_USERNAME:weather}
    password: ${DB_PASSWORD:weather}
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

open-meteo:
  base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
  geocoding-base-url: ${OPEN_METEO_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
