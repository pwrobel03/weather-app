spring:
  application:
    name: weather-app-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/weather}
    username: ${DB_USERNAME:weather}
    password: ${DB_PASSWORD:weather}
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

open-meteo:
  base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
  geocoding-base-url: ${OPEN_METEO_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}

imgw:
  base-url: ${IMGW_BASE_URL:https://danepubliczne.imgw.pl}

anonymous-cleanup:
  enabled: ${ANONYMOUS_CLEANUP_ENABLED:true}
  interval: ${ANONYMOUS_CLEANUP_INTERVAL:1d}
  initial-delay: ${ANONYMOUS_CLEANUP_INITIAL_DELAY:5m}

alert-ingest:
  enabled: ${ALERT_INGEST_ENABLED:true}
  interval: ${ALERT_INGEST_INTERVAL:10m}
  initial-delay: ${ALERT_INGEST_INITIAL_DELAY:30s}

jwt:
  # Dev-only fallback - any real deployment must override via JWT_SECRET.
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-any-real-deployment}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}

meteoalarm:
  base-url: ${METEOALARM_BASE_URL:https://feeds.meteoalarm.org}
  feed-path: ${METEOALARM_FEED_PATH:/api/v1/warnings/feeds-poland}

# Firebase Cloud Messaging, spoken to directly rather than through a relay
# (decision 27). Empty locally on purpose: a developer without a key still gets
# the socket, and a backend refusing to start without one would make push a
# prerequisite for working on the forecast.
fcm:
  base-url: ${FCM_BASE_URL:https://fcm.googleapis.com}
  project-id: ${FCM_PROJECT_ID:}
  # The whole service-account key file, not a path - on a hosted backend it
  # arrives as an environment variable, and a path would mean writing a secret
  # to disk on every deploy.
  service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
